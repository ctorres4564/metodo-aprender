name: Tests

# As 3 suítes do plano de testes (ver commits das Fases 1-5), rodando em
# paralelo: unitários (rápido, sem dependência externa), Firebase Emulator
# (regras Firestore/Storage + Stripe/exclusão de conta) e E2E (Playwright).
# Nenhum job precisa de credencial real da Stripe/Firebase/OpenRouter —
# tudo roda contra emulator local ou mocks.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Unitários (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  emulator:
    name: Firestore/Storage/Auth + Stripe (Firebase Emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - name: Cache dos binários do Firebase Emulator
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}
      - run: npm run test:emulator

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - name: Cache dos binários do Firebase Emulator
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}
      - name: Instala o Chromium do Playwright
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Guarda o relatório do Playwright (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
